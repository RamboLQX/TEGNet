[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tegnet-method"
version = "0.1.0"
description = "Text-guided epidemic graph forecasting: method implementation"
license = "Apache-2.0"
license-files = ["LICENSE", "src/tegnet/third_party/laya/LICENSE"]
requires-python = ">=3.11,<3.12"
dependencies = ["torch==2.5.1"]

[project.optional-dependencies]
laya = [
    "numpy==1.26.3",
    "transformers==4.51.3",
    "safetensors==0.5.3",
    "tokenizers==0.21.1",
    "huggingface-hub==0.31.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tegnet = ["resources/*.json", "third_party/laya/LICENSE", "third_party/laya/README.md"]
